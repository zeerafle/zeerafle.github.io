<footer class="foot">
  <div class="wrap foot__in">
    <span class="foot__fin">[EOF] FIN.<span class="foot__exit meta"> exit 0</span></span>
    <span class="meta">&copy; {{ 'now' | date: '%Y' }} {{ site.name }}
      {%- for l in site.data.links %}{% if l.label == 'GitHub' or l.label == 'X' %} &middot; <a href="{{ l.url }}" rel="me noopener">{{ l.label }}</a>{% endif %}{% endfor %}
      &middot; <a href="{{ '/feed.xml' | relative_url }}">RSS</a></span>
  </div>
</footer>
