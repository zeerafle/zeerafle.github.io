<!doctype html>
<html lang="{{ site.locale | default: 'en' }}">
<head>
  {% include head.html %}
  <title>{% if page.title and page.url != '/' %}{{ page.title }} &mdash; {% endif %}{{ site.title }}</title>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include nav.html %}
  <main id="main" class="wrap fade">
    {{ content }}
  </main>
  {% include footer.html %}
  {% include ask.html %}
  {% include search.html %}
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/ascii.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/ask.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
</body>
</html>
