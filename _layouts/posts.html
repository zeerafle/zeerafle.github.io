---
layout: default
---
<h1 class="page-title">{{ page.title }}</h1>
{{ content }}
{% assign by_year = site.posts | group_by_exp: 'p', "p.date | date: '%Y'" %}
{% for g in by_year %}
<section aria-labelledby="y{{ g.name }}">
  <h2 id="y{{ g.name }}" class="meta label">{{ g.name }}</h2>
  <ul class="credits">
    {% for item in g.items %}{% include credit-row.html item=item %}{% endfor %}
  </ul>
</section>
{% endfor %}
