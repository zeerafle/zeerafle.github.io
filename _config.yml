# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: temaram
name: Sam Fareez
email: vsefareez@outlook.com
tagline: Notes, work, and stray frames.
description: >-
  Notes, work, and stray frames in dim, warm light. Projects, writing and
  college notes from Sam Fareez.
url: "https://samfareez.is-a.dev"
baseurl: ""
twitter_username: zeerafle
github_username: zeerafle
username: samfareez # shown in the nav prompt: samfareez@temaram:~$
twitter:
  username: zeerafle # for jekyll-seo-tag
locale: id-ID
lang: id-ID

# Build settings
markdown: kramdown
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: Turkey
# `$ ask` drawer (assets/js/ask.js). OpenAI-compatible endpoint. NEVER put an API key here: this file ships to the browser.
chatbot:
  url: "https://zeerafle-llm.duckdns.org/v1"
  model: "" # blank = omit and let the gateway pick
  system: "You are the assistant on Sam Fareez's personal site, temaram. Be brief and plain. Reply in the language the visitor writes in. If you do not know something about Sam, say so instead of guessing."
repository: "zeerafle/zeerafle.github.io"

include:
  - _pages

# Exclude from the published site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - requirements.txt
  - sync_pinecone.py
  - node_modules
  - vendor
  - .bundle
  - .github
  - .claude
  - .jekyll-cache

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-toc

toc:
  min_level: 1
  max_level: 3

author:
  name: "Sam Fareez"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "AI nerd. Cinephile"

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, kind: Blog }
  - scope: { path: "_pages" }
    values: { layout: single }
  - scope: { path: "", type: college-notes }
    values: { layout: post, kind: Note, toc: true }
  - scope: { path: "_college-notes/season-5" }
    values: { hidden: true }
  - scope: { path: "", type: portfolio }
    values: { layout: project, toc: true }

collections:
  college-notes:
    output: true
    permalink: /:collection/:path
  portfolio:
    output: true
    permalink: /:collection/:path

