<header class="nav">
  <div class="wrap nav__in">
    <a class="nav__brand" href="{{ '/' | relative_url }}">{{ site.username | default: site.github_username }}@{{ site.title }}:~$<span class="cursor" aria-hidden="true"></span></a>
    <div class="nav__r">
    <nav aria-label="Primary" class="nav__links">
      {% assign here = page.url %}
      <a href="{{ '/portfolio/' | relative_url }}"{% if here contains '/portfolio' %} aria-current="page"{% endif %}>~/portfolio</a>
      <a href="{{ '/posts/' | relative_url }}"{% if here == '/posts/' or page.collection == 'posts' or page.layout == 'post' and page.kind == 'Blog' %} aria-current="page"{% endif %}>~/posts</a>
      <a href="{{ '/college-notes/' | relative_url }}"{% if here contains '/college-notes' %} aria-current="page"{% endif %}>~/notes</a>
      <a href="{{ '/about/' | relative_url }}"{% if here contains '/about' %} aria-current="page"{% endif %}>~/about</a>
    </nav>
    <button type="button" class="theme-toggle" data-theme-toggle></button>
    </div>
  </div>
</header>
